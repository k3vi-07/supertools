name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-check:
    name: Release quality check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPERTOOLS_COMMUNITY_DIR: ${{ github.workspace }}/supertools-community
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout community plugins
        uses: actions/checkout@v4
        with:
          repository: k3vi-07/supertools-community
          ref: master
          path: supertools-community
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate, type-check and test
        run: |
          npm run validate:all
          npm test

  build:
    name: Build ${{ matrix.name }}
    needs: quality-check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            name: macOS
            command: npx electron-builder --mac
          - os: windows-latest
            platform: win
            name: Windows x64
            command: npx electron-builder --win
          - os: ubuntu-latest
            platform: linux
            name: Linux x64
            command: npx electron-builder --linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate app icon
        run: node scripts/generate-icon.mjs
      - name: Build application
        run: npx electron-vite build
      - name: Package ${{ matrix.name }}
        run: ${{ matrix.command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload ${{ matrix.name }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperTools-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SuperTools-*
          path: release-artifacts
          merge-multiple: true
      - name: Verify release version
        shell: bash
        run: |
          PACKAGE_TAG="v$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${PACKAGE_TAG}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PACKAGE_TAG}" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${PACKAGE_TAG}" >> "$GITHUB_ENV"
      - name: Generate SHA-256 checksums
        working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release once
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
