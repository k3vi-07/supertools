name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            artifact: SuperTools-*-arm64.dmg
            name: macOS (Apple Silicon)
          - os: windows-latest
            platform: win
            artifact: SuperTools Setup *.exe
            name: Windows (x64)
          - os: ubuntu-latest
            platform: linux
            artifact: SuperTools-*.AppImage
            name: Linux (x64)

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Generate app icon
        run: node scripts/generate-icon.mjs

      - name: 🔍 Validate manifests (pre-build check)
        run: npm run validate

      - name: 🔨 Build with electron-vite
        run: npx electron-vite build

      - name: 🏗️ Package with electron-builder
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔏 Ad-hoc sign macOS app (no Apple Developer account needed)
        if: matrix.platform == 'mac'
        run: |
          # 对所有 .app 和 .dmg 执行 ad-hoc 签名
          # ad-hoc 签名不等于正式签名，但能减少 macOS "已损坏" 报错
          find dist -name "*.app" -type d -exec codesign --force --deep --sign - {} \; 2>/dev/null || true
          find dist -name "*.dmg" -exec codesign --force --sign - {} \; 2>/dev/null || true
          echo "✅ Ad-hoc signing complete"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SuperTools-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
          retention-days: 30

      - name: 📝 Read version
        id: version
        run: echo "VERSION=v$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: 🚀 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
            dist/*.AppImage
            dist/*.yml
          draft: false
          prerelease: false
          tag_name: ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
