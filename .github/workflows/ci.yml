name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality-check:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPERTOOLS_COMMUNITY_DIR: ${{ github.workspace }}/supertools-community

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Checkout community plugins
        uses: actions/checkout@v4
        with:
          repository: k3vi-07/supertools-community
          ref: master
          path: supertools-community

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Generate app icon
        run: node scripts/generate-icon.mjs

      - name: 🔍 Validate manifests and community registry
        run: npm run validate:all

      - name: 🧪 Run tests
        run: npm test

      - name: 🔨 Build
        run: npm run build
